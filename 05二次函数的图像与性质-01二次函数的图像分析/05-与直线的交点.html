yan-700" type="range" id="n" min="-5" max="5" value="0" step="0.25"></div><dl id="readouts" class="text-sm" aria-live="polite"></dl></div></section></aside><section class="q-card q-solution"><div class="flex items-center justify-between gap-2 mb-3"><h2 id="solution-title" class="text-base font-bold text-slate-900 flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-indigo-500"></span>详细解析</h2><button id="toggle-solution" type="button" aria-label="收起或展开详细解析" aria-expanded="true" class="w-8 h-8 rounded-lg border text-slate-600">‹</button></div><div id="solution-body"><article class="q-step"><h3 class="font-semibold">联立两个函数</h3><p class="mt-2 leading-relaxed">令 $ax^{2}+bx+c=mx+n$，得到 $ax^{2}+(b-m)x+(c-n)=0$。</p></article><article class="q-step"><h3 class="font-semibold">判别式数交点</h3><p class="mt-2 leading-relaxed">$\Delta =(b-m)^{2}-4a(c-n)$。$\Delta &gt;0$、＝$0$、＜$0$ 分别对应两个、一个、零个交点。</p></article></div></section><main class="q-card q-board"><div class="flex items-center justify-between gap-2 mb-3"><h2 class="text-base font-bold text-slate-900 flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-indigo-500"></span>数形结合·动态交互几何画板</h2><button id="reset" type="button" class="text-xs font-semibold text-indigo-700">重置</button></div><div class="q-stage"><canvas id="geometry-canvas" aria-label="与直线的交点动态函数图像"></canvas><canvas id="draw-canvas" aria-label="画板标注层"></canvas><!-- 画笔工具栏 -->
