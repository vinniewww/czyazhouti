<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>系数与图像</title><script src="../assets/tailwind.js"></script><link rel="stylesheet" href="../assets/katex/katex.min.css"><link rel="stylesheet" href="../assets/chapter-05-layout.css"><link rel="stylesheet" href="../assets/course-ui.css"></head><body class="course-detail-page"><div class="q-layout q-math"><div id="topbar" class="flex flex-wrap items-center gap-x-5 gap-y-1 bg-white rounded-xl border border-slate-200 px-4 py-2 shadow-sm text-sm"><h1 class="font-bold text-slate-900">系数与图像</h1><span aria-hidden="true" class="text-slate-300">|</span><nav class="flex flex-wrap gap-x-4 text-indigo-700" aria-label="课件导航"><a href="index.html">← 返回课件目录</a>　<a href="01-%E5%BC%A0%E5%AE%B6%E7%95%8C%E5%BC%95%E4%BE%8B-%E4%BB%8E%E6%8A%9B%E7%89%A9%E7%BA%BF%E8%AF%BB%E7%AC%A6%E5%8F%B7.html">下一页 →</a></nav></div><div class="q-columns"><aside class="q-left"><section class="q-card q-problem"><h2 class="text-base font-bold text-slate-900 flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>问题与条件</h2><div class="mt-3"><p class="mt-2 leading-relaxed">分别改变 $a$、$b$、$c$，观察开口、对称轴和纵截距。$a=0$ 时显示退化后的函数。</p><img src="./assets/quadratic/fig-1.png" alt="系数与图像 · 教材原图" class="mx-auto my-3 max-h-64 max-w-full object-contain"></div></section><section class="q-card q-controls"><h2 class="text-base font-bold text-slate-900 flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span>动态控制台</h2><div class="mt-3"><div><div class="mb-1 flex justify-between gap-3"><label for="a">二次项系数 $a$</label><output class="font-semibold" for="a"></output></div><input class="w-full accent-cyan-700" type="range" id="a" min="-2" max="2" value="1" step="0.1"></div><div><div class="mb-1 flex justify-between gap-3"><label for="b">一次项系数 $b$</label><output class="font-semibold" for="b"></output></div><input class="w-full accent-cyan-700" type="range" id="b" min="-4" max="4" value="-2" step="0.1"></div><div><div class="mb-1 flex justify-between gap-3"><label for="c">常数项 $c$</label><output class="font-semibold" for="c"></output></div><input class="w-full accent-cyan-700" type="range" id="c" min="-5" max="5" value="1" step="0.1"></div><dl id="readouts" class="text-sm" aria-live="polite"></dl></div></section></aside><section class="q-card q-solution"><div class="flex items-center justify-between gap-2 mb-3"><h2 id="solution-title" class="text-base font-bold text-slate-900 flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-indigo-500"></span>详细解析</h2><button id="toggle-solution" type="button" aria-label="收起或展开详细解析" aria-expanded="true" class="w-8 h-8 rounded-lg border text-slate-600">‹</button></div><div id="solution-body"><article class="q-step"><h3 class="font-semibold">$a$ 决定开口</h3><p class="mt-2 leading-relaxed">$a&gt;0$ 向上，$a&lt;0$ 向下。在相同坐标比例下，$|a|$ 越大，开口越窄。</p></article><article class="q-step"><h3 class="font-semibold">$a$ 和 $b$ 一起决定对称轴</h3><p class="mt-2 leading-relaxed">对称轴 $x=-\frac{b}{2a}$。$a$、$b$ 同号时在 $y$ 轴左侧，异号时在右侧；$b=0$ 时与 $y$ 轴重合。</p></article><article class="q-step"><h3 class="font-semibold">$c$ 是纵截距</h3><p class="mt-2 leading-relaxed">令 $x=0$，得到 $y=c$，故图像过 $(0,c)$。</p></article></div></section><main class="q-card q-board"><div class="flex items-center justify-between gap-2 mb-3"><h2 class="text-base font-bold text-slate-900 flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-indigo-500"></span>数形结合·动态交互几何画板</h2><button id="reset" type="button" class="text-xs font-semibold text-indigo-700">重置</button></div><div class="q-stage"><canvas id="geometry-canvas" aria-label="系数与图像动态函数图像"></canvas><canvas id="draw-canvas" aria-label="画板标注层"></canvas><!-- 画笔工具栏 -->
                <div class="absolute top-4 right-4 z-10 flex items-center gap-1 bg-slate-900/85 backdrop-blur-md p-1.5 rounded-xl border border-slate-700 shadow-lg">
                    <button id="pen-btn" type="button" title="画笔" class="w-8 h-8 flex items-center justify-center rounded-lg text-slate-300 hover:bg-slate-700 hover:text-white transition-colors cursor-pointer">
                        <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 20h9"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
                    </button>
                    <button id="eraser-btn" type="button" title="橡皮擦" class="w-8 h-8 flex items-center justify-center rounded-lg text-slate-300 hover:bg-slate-700 hover:text-white transition-colors cursor-pointer">

                    </button>
                    <span class="w-px h-5 bg-slate-700 mx-0.5"></span>
                    <div class="flex items-center gap-1">
                        <button type="button" class="draw-swatch w-5 h-5 rounded-full cursor-pointer ring-2 ring-white" data-color="#ffffff" style="background:#ffffff" title="白色"></button>
                        <button type="button" class="draw-swatch w-5 h-5 rounded-full cursor-pointer ring-1 ring-slate-600" data-color="#2dd4bf" style="background:#2dd4bf" title="青色"></button>
                        <button type="button" class="draw-swatch w-5 h-5 rounded-full cursor-pointer ring-1 ring-slate-600" data-color="#fbbf24" style="background:#fbbf24" title="琥珀"></button>

                    </button>
                </div>
