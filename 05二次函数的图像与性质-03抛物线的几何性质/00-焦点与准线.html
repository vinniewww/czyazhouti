<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>焦点与准线</title><script src="../assets/tailwind.js"></script><link rel="stylesheet" href="../assets/katex/katex.min.css"><link rel="stylesheet" href="../assets/chapter-05-layout.css"><link rel="stylesheet" href="../assets/course-ui.css"></head><body class="course-detail-page"><div class="q-layout q-math"><div id="topbar" class="flex flex-wrap items-center gap-x-5 gap-y-1 bg-white rounded-xl border border-slate-200 px-4 py-2 shadow-sm text-sm"><h1 class="font-bold text-slate-900">焦点与准线</h1><span aria-hidden="true" class="text-slate-300">|</span><nav class="flex flex-wrap gap-x-4 text-indigo-700" aria-label="课件导航"><a href="index.html">← 返回本节</a><a href="01-%E7%94%A8%E5%87%86%E7%BA%BF%E6%9B%BF%E6%8D%A2%E8%B7%9D%E7%A6%BB.html">下一页 →</a></nav></div><div class="q-columns"><aside class="q-left"><section class="q-card q-problem"><h2 class="text-base font-bold text-slate-900 flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>题目与条件</h2><p class="mt-3">动点到定点与到定直线的距离始终相等。这样的动点形成什么图形？</p><img loading="lazy" src="assets/figure-00-1.png" alt="焦点和准线的等距定义" class="mx-auto my-3 max-h-64 max-w-full object-contain"></section><section class="q-card q-controls"><h2 class="text-base font-bold text-slate-900 flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span>动态控制台</h2><div class="mt-3"><label><output></output>$P$ 的横坐标<input aria-label="P 的横坐标" type="range" min="-5" max="5" step="0.1" value="2"></label><label><output></output>焦距参数 $p$<input aria-label="焦距参数 p" type="range" min="0.5" max="2.5" step="0.1" value="1"></label><p id="values" aria-live="polite"></p></div></section></aside><section class="q-card q-solution"><div class="flex items-center justify-between gap-2 mb-3"><h2 id="solution-title" class="text-base font-bold text-slate-900 flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-indigo-500"></span>详细解析</h2><button id="toggle-solution" type="button" aria-label="收起或展开详细解析" aria-expanded="true" class="w-8 h-8 rounded-lg border text-slate-600">‹</button></div><div id="solution-body"><article class="q-step"><h3 class="font-semibold">从等距列方程</h3><p>设焦点 $F=(0,p)$，准线为 $y=-p$，且 $p>0$。动点 $(x,y)$ 满足 $x^2+(y-p)^2=(y+p)^2$，化简得 $x^2=4py$。</p></article><article class="q-step"><h3 class="font-semibold">从解析式反求焦点</h3><p>对于 $y=a(x-h)^2+k$，焦点是 $(h,k+\frac1{4a})$，准线为 $y=k-\frac1{4a}$。</p></article></div></section><main class="q-card q-board"><div class="flex items-center justify-between gap-2 mb-3"><h2 class="text-base font-bold text-slate-900 flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-indigo-500"></span>数形结合·动态交互几何画板</h2><button id="reset" type="button" class="text-xs font-semibold text-indigo-700">重置</button></div><div class="q-stage"><svg id="geometry-svg" viewBox="0 0 640 440" role="img" aria-label="焦点与准线动态示意图"></svg><canvas id="draw-canvas" aria-label="画板标注层"></canvas><!-- 画笔工具栏 -->
